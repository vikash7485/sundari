<!doctype html>
<!-- Source for public/og-image.png (1200x630) – the preview shown when the site is shared on WhatsApp/Facebook.
     Re-render by opening this file in Chrome at 1200x630 and taking a screenshot. -->
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,500&family=Poppins:wght@400;500&family=Tiro+Devanagari+Hindi&display=swap" />
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body {
    background: radial-gradient(120% 90% at 78% 40%, #8E2637 0%, #5A1420 48%, #3E0D16 100%);
    font-family: Poppins, sans-serif; color: #fff; position: relative;
  }
  .dots { position: absolute; inset: 0; background-image: radial-gradient(rgba(232,207,138,.13) 1px, transparent 1.3px); background-size: 18px 18px; }
  .frame { position: absolute; inset: 22px; border: 1.5px solid rgba(201,162,74,.55); border-radius: 18px; }
  .frame::after { content: ""; position: absolute; inset: 8px; border: 1px solid rgba(201,162,74,.25); border-radius: 12px; }
  .text { position: absolute; left: 80px; top: 92px; width: 640px; }
  .blessing { font-family: 'Tiro Devanagari Hindi', serif; color: #E8CF8A; font-size: 22px; letter-spacing: .04em; }
  .hi { font-family: 'Tiro Devanagari Hindi', serif; font-size: 92px; line-height: 1.25; margin-top: 18px;
        background: linear-gradient(100deg,#B8892F 0%,#F1D88E 45%,#C9A24A 60%,#9C7224 100%); -webkit-background-clip: text; color: transparent; }
  .en { font-family: 'Playfair Display', serif; font-weight: 600; font-size: 56px; margin-top: 2px; }
  .tag { font-family: 'Playfair Display', serif; font-style: italic; color: #E8CF8A; font-size: 30px; margin-top: 18px; }
  .sub { color: rgba(255,255,255,.82); font-size: 22px; margin-top: 10px; }
  .addr { position: absolute; left: 80px; bottom: 70px; display: flex; gap: 14px; align-items: center; font-size: 22px; color: rgba(255,255,255,.9); }
  .pill { background: linear-gradient(180deg,#D9B860,#C9A24A 55%,#B38C35); color: #3E0D16; font-weight: 500; padding: 10px 22px; border-radius: 999px; }
  svg.neck { position: absolute; right: 30px; top: 70px; width: 470px; filter: drop-shadow(0 18px 30px rgba(0,0,0,.45)); }
</style>
</head>
<body>
  <div class="dots"></div>
  <div class="frame"></div>
  <div class="text">
    <div class="blessing">१ तूहि निरंकार</div>
    <div class="hi">सुन्दरी ज्वेलर्स</div>
    <div class="en">Sundari Jewellers</div>
    <div class="tag">“We Value Your Association”</div>
    <div class="sub">Gold · Silver · Bridal · Fancy Jewellery</div>
  </div>
  <div class="addr"><span class="pill">Call 8757575209</span> Mahadev Chowk, Tajpur Road, Samastipur</div>
  <svg class="neck" id="neck" viewBox="0 0 600 600"></svg>
  <script>
    // Same layered necklace as the website hero
    const ns = 'http://www.w3.org/2000/svg'
    const svg = document.getElementById('neck')
    svg.innerHTML = `<defs>
      <radialGradient id="g" cx="35%" cy="30%" r="75%"><stop offset="0" stop-color="#FFF3C4"/><stop offset=".45" stop-color="#E3BE62"/><stop offset="1" stop-color="#9C7224"/></radialGradient>
      <radialGradient id="r" cx="35%" cy="30%" r="75%"><stop offset="0" stop-color="#F27B8C"/><stop offset=".5" stop-color="#B0213A"/><stop offset="1" stop-color="#5C0A18"/></radialGradient>
      <radialGradient id="p" cx="35%" cy="30%" r="75%"><stop offset="0" stop-color="#fff"/><stop offset=".6" stop-color="#F3E9D6"/><stop offset="1" stop-color="#C9B999"/></radialGradient></defs>`
    const pt = (rx, ry, deg) => [300 + rx * Math.sin(deg * Math.PI / 180), 20 + ry * Math.cos(deg * Math.PI / 180)]
    let html = ''
    for (let i = 0; i < 25; i++) { const [x, y] = pt(186, 206, -74 + 148 * i / 24); html += `<circle cx="${x}" cy="${y}" r="5.2" fill="url(#p)"/>` }
    for (let i = 0; i < 31; i++) {
      const deg = -78 + 156 * i / 30; const [x, y] = pt(236, 270, deg)
      if (i % 3 === 0 && Math.abs(deg) < 70 && Math.abs(deg) > 4)
        html += `<g transform="translate(${x} ${y}) rotate(${-deg * .25})"><line x1="0" y1="6" x2="0" y2="20" stroke="url(#g)" stroke-width="2"/><path d="M0 20c6 7 9 11 9 15.5a9 9 0 0 1-18 0C-9 31 -6 27 0 20z" fill="url(#g)"/><path d="M0 28c3 4 4.5 6 4.5 8a4.5 4.5 0 0 1-9 0c0-2 1.5-4 4.5-8z" fill="url(#r)"/></g>`
      html += `<circle cx="${x}" cy="${y}" r="${i % 2 ? 6 : 8.5}" fill="url(#g)"/>` + (i % 2 ? '' : `<circle cx="${x}" cy="${y}" r="3.4" fill="url(#r)"/>`)
    }
    html += `<g transform="translate(300 290)"><line x1="0" y1="0" x2="0" y2="16" stroke="url(#g)" stroke-width="3"/><g transform="translate(0 50)">`
    for (let i = 0; i < 16; i++) html += `<circle r="4.2" cy="-33" transform="rotate(${i * 22.5})" fill="url(#p)"/>`
    html += `<circle r="27" fill="url(#g)"/><circle r="13" fill="url(#r)"/></g><g transform="translate(0 86)"><line x1="0" y1="0" x2="0" y2="10" stroke="url(#g)" stroke-width="2.5"/><path d="M0 10c9 10 13 16 13 22a13 13 0 0 1-26 0c0-6 4-12 13-22z" fill="url(#g)"/><path d="M0 21c4 5 6.5 8 6.5 11a6.5 6.5 0 0 1-13 0c0-3 2.5-6 6.5-11z" fill="url(#r)"/></g></g>`
    svg.insertAdjacentHTML('beforeend', html)
  </script>
</body>
</html>
