<!doctype html>
<!-- Source for public/apple-touch-icon.png (180x180, home-screen icon on phones). -->
<html>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tiro+Devanagari+Hindi&display=swap" />
<style>
  html, body { margin: 0; width: 180px; height: 180px; overflow: hidden; }
  body { background: radial-gradient(circle at 40% 35%, #8E2637, #5A1420 70%); display: grid; place-items: center; }
  .ring { width: 150px; height: 150px; border-radius: 50%; box-shadow: inset 0 0 0 3px #C9A24A, inset 0 0 0 7px rgba(201,162,74,.25); display: grid; place-items: center; }
  span { font-family: 'Tiro Devanagari Hindi', serif; font-size: 84px; line-height: 1; transform: translateY(-6px);
         background: linear-gradient(120deg,#F1D88E,#C9A24A 60%,#9C7224); -webkit-background-clip: text; color: transparent; }
</style>
</head>
<body><div class="ring"><span>सु</span></div></body>
</html>
